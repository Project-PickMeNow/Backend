# Prometheus 스크랩 설정 — Pick Me Now 백엔드 지표를 수집한다.
# 앱은 보통 호스트에서 실행(npm run start:dev)되므로 host.docker.internal 로 접근한다.
# (docker-compose.monitoring.yml 에서 Linux 대비 host-gateway 를 extra_hosts 로 매핑한다.)
global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: pickmenow-backend
    metrics_path: /api/metrics # 전역 prefix(/api) 때문에 /api/metrics
    static_configs:
      # ⚠️ 포트는 앱의 실제 PORT(.env)와 일치시킬 것. 현재 이 프로젝트 .env 는 PORT=3001.
      #    (기본값은 3000 — .env 를 바꾸면 여기 포트도 함께 바꾼다.)
      - targets: ['host.docker.internal:3001']
        labels:
          service: backend

  # Prometheus 자기 자신도 모니터링
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
