# Grafana 대시보드 자동 프로비저닝 — /var/lib/grafana/dashboards 의 JSON 을 불러온다.
apiVersion: 1

providers:
  - name: pickmenow
    orgId: 1
    folder: 'Pick Me Now'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 15
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
