name: Release Drafter

# main 브랜치에 PR 머지될 때마다 자동으로 다음 릴리스 노트 초안 갱신
# 별도 설정 파일: .github/release-drafter.yml
#
# ⚠️ pull_request 트리거 제거 사유:
#   release-drafter는 설정 파일을 default branch(main)에서만 읽음.
#   PR 브랜치에서 트리거되면 main에 config 없어 "Invalid config file" 에러 발생.
#   따라서 main push에만 동작하도록 제한.
#   (config가 main에 안정적으로 머지된 뒤 PR 트리거를 다시 추가해도 됨)

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: read

jobs:
  update-draft:
    name: Update release draft
    runs-on: ubuntu-latest
    steps:
      - name: Draft next release notes
        uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
