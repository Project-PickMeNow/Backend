# Prometheus 스크랩 설정 (프로덕션 · EC2).
# prod 스택과 같은 도커 네트워크(pickmenow-prod)에서 app 컨테이너의 /api/metrics 를
# 직접 스크랩한다(Caddy 를 거치지 않는다).
#
# ⚠️ 로컬 개발용은 prometheus.yml 을 쓴다(대상이 host.docker.internal:3001).
#    프로덕션 앱 컨테이너의 내부 포트는 docker-compose.prod.yml 에서 3000 으로 고정된다.
global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: pickmenow-backend
    metrics_path: /api/metrics # 전역 prefix(/api) 때문에 /api/metrics
    static_configs:
      # prod app 컨테이너는 내부 포트 3000 고정. compose 서비스명 'app' 으로 접근한다.
      - targets: ['app:3000']
        labels:
          service: backend

  # Prometheus 자기 자신도 모니터링
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
