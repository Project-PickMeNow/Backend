name: Deploy to EC2

# CI(빌드·테스트) 성공 후에만 배포되도록 게이팅한다.
# main으로의 push는 CI를 트리거하고, CI가 성공으로 끝났을 때만 이 배포가 실행된다.
# (CI 실패 시 또는 PR 브랜치의 CI에는 배포되지 않음)
#
# ┌─ 사전 준비: Settings → Secrets and variables → Actions ────────────────────┐
# │  DOCKER_USERNAME : Docker Hub 계정명                                        │
# │  DOCKER_PASSWORD : Docker Hub 액세스 토큰 (비밀번호 대신 토큰 권장)          │
# │  EC2_HOST        : EC2 퍼블릭 IP 또는 도메인                                 │
# │  EC2_USER        : SSH 사용자 (Amazon Linux=ec2-user, Ubuntu=ubuntu)         │
# │  EC2_KEY         : EC2 접속용 개인키(.pem) 전체 내용                         │
# └────────────────────────────────────────────────────────────────────────────┘
# 서버에는 사전에 docker / docker compose 설치 + ~/app 디렉터리 + .env 배치가 필요하다.
# 레포 루트에는 Dockerfile 과 docker-compose.prod.yml 이 있어야 한다.
#
# ⚠️ Phase 4 까지 자동 배포를 꺼 둔다 (수동 실행만 가능).
#    이유: 바로 위 전제인 Dockerfile · docker-compose.prod.yml 이 아직 레포에 없다.
#          이 상태로 자동 트리거를 켜 두면 main 에 머지될 때마다 CI 성공 직후 배포가 돌고
#          Docker 빌드 단계에서 반드시 실패해, 진짜 배포 실패와 구분이 안 된다.
#    개발계획서 기준 Phase 1~3 배포는 관리형(https 기본)을 쓰고, EC2 는 Phase 4 에서 다룬다.
#
#    [Phase 4 재활성화 방법]
#      1) 아래 workflow_dispatch 를 지우고 주석 처리된 workflow_run 블록을 되살린다.
#      2) deploy 잡의 CI 성공 게이팅 if 조건(주석 처리됨)도 함께 되살린다.
#      3) Dockerfile 과 docker-compose.prod.yml 을 레포 루트에 추가한다.
on:
  workflow_dispatch:
  # workflow_run:
  #   workflows: ["CI"]
  #   types: [completed]
  #   branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # (Phase 4 재활성화 시 되살릴 것) CI 결론이 success일 때만 배포 — 실패/취소 시 차단
    # if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout (CI가 검증한 정확한 커밋)
        # workflow_run 일 땐 CI가 검증한 커밋, 수동 실행일 땐 실행 시점 커밋을 쓴다.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker 이미지 빌드 및 푸시
        # latest 와 커밋 SHA 두 태그를 함께 밀어, 문제 시 SHA 태그로 롤백할 수 있게 한다.
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/siheung-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/siheung-backend:${{ github.event.workflow_run.head_sha || github.sha }}

      - name: EC2에 compose·Caddy 파일 복사
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          # Caddy(리버스 프록시)가 Caddyfile 을 읽으므로 compose 와 함께 복사한다.
          # 관측 스택(모니터링 compose + monitoring/ 설정 디렉터리)도 함께 복사한다.
          source: "docker-compose.prod.yml,docker-compose.monitoring.prod.yml,Caddyfile,monitoring"
          target: "~/app"

      - name: EC2 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -euo pipefail
            cd ~/app
            # 이번에 푸시한 이미지 태그를 .env 에 갱신 (중복 라인 없이 교체)
            IMAGE="${{ secrets.DOCKER_USERNAME }}/siheung-backend:${{ github.event.workflow_run.head_sha || github.sha }}"
            touch .env
            sed -i '/^DOCKER_IMAGE=/d' .env
            echo "DOCKER_IMAGE=${IMAGE}" >> .env
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            # 관측 스택(Grafana/Prometheus/Loki/Promtail) — prod 가 만든 네트워크·로그 볼륨을 공유한다.
            # GRAFANA_ADMIN_PASSWORD 가 .env 에 없으면 이 단계만 건너뛰고 앱 배포는 계속한다.
            docker compose -f docker-compose.monitoring.prod.yml up -d \
              || echo "⚠️ 모니터링 스택 기동 실패(GRAFANA_ADMIN_PASSWORD 확인). 앱 배포는 정상."
            docker image prune -f
            echo "✅ Deploy done: ${IMAGE}"
