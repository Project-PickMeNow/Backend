# Issue Template 진입점 설정
# - blank_issues_enabled: false 로 두면 사용자가 반드시 템플릿을 선택해야 함
# - contact_links: 이슈가 아닌 외부 채널로 안내 (Slack, 문서, 보안 등)

blank_issues_enabled: false

contact_links:
  - name: 💬 일반 질문 / 토론
    url: https://github.com/techeer-project-team-F/BackEnd_Project/discussions
    about: 버그/기능이 아닌 질문이나 아이디어는 Discussions 를 이용해 주세요.

  - name: 🔐 보안 취약점 비공개 제보
    url: https://github.com/techeer-project-team-F/BackEnd_Project/security/advisories/new
    about: 보안 이슈는 공개 이슈 대신 Private Vulnerability Reporting 으로 제보해 주세요.

  - name: 📚 프로젝트 위키 / 운영 문서
    url: https://github.com/techeer-project-team-F/BackEnd_Project/wiki
    about: API 명세, 인프라 가이드, 운영 룬북은 Wiki 에서 확인하세요.
