# 프로덕션 스택 (EC2). deploy.yml 이 이 파일과 Caddyfile 을 ~/app 로 복사하고
#   docker compose -f docker-compose.prod.yml pull && up -d
# 를 실행한다. 앱 이미지는 CI 가 빌드·푸시한 뒤 .env 의 DOCKER_IMAGE 로 지정한다.
#
# 필요한 환경변수는 같은 디렉터리의 .env 에 둔다(.env.prod.example 참고).
# TLS/wss 는 Caddy 리버스 프록시가 처리한다 — .env 의 DOMAIN 으로 Let's Encrypt 인증서를
# 자동 발급/갱신하고, wss(WebSocket) 업그레이드도 그대로 프록시한다. 앱은 외부로 직접 노출하지 않고
# Caddy(80/443)만 공개한다(보안그룹에서 80/443 만 열면 된다).
services:
  # ── 리버스 프록시 (HTTPS/wss 종단, 인증서 자동) ──
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      # 백엔드 도메인(예: api.pickmeup.example.com). 이 도메인 A 레코드가 EC2 퍼블릭 IP 를 가리켜야
      # Caddy 가 Let's Encrypt 인증서를 발급받는다.
      DOMAIN: ${DOMAIN}
      # 인증서 만료 알림 이메일(선택). 없어도 발급은 된다.
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 인증서·ACME 계정을 영속화한다 — 재시작마다 재발급(레이트리밋)되지 않게 필수.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    image: ${DOCKER_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      # 컨테이너 내부는 항상 3000 으로 고정. .env 의 PORT 보다 우선한다.
      PORT: 3000
    # 외부로 포트를 직접 노출하지 않는다 — Caddy 가 compose 내부망에서 app:3000 으로 프록시한다.
    expose:
      - '3000'
    volumes:
      # 앱 로그(/app/logs/app.log)를 볼륨에 남겨 모니터링 스택의 Promtail 이 읽게 한다.
      # (docker-compose.monitoring.prod.yml 이 이 볼륨을 external 로 참조한다.)
      - app_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # POSTGRES_USER/PASSWORD/DB 를 .env 에서 읽는다(앱의 DATABASE_URL 과 반드시 일치).
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pickmeup}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  # 앱 로그 볼륨 — 모니터링 스택(Promtail)이 external 로 공유해 읽는다. 이름을 고정한다.
  app_logs:
    name: pickmenow_app_logs

networks:
  # 네트워크 이름을 고정해, 모니터링 스택(docker-compose.monitoring.prod.yml)이
  # external 로 이 네트워크에 합류할 수 있게 한다.
  default:
    name: pickmenow-prod
