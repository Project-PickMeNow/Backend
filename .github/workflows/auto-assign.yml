name: Auto Assign Author

# 이슈/PR 작성자를 자동으로 assignee 로 지정
# 깜빡하고 self-assign 안 하는 경우를 방지

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  issues: write
  pull-requests: write

jobs:
  assign-author:
    name: Assign issue/PR to author
    runs-on: ubuntu-latest
    steps:
      - name: Self-assign
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const isIssue = !!context.payload.issue;
            const number = isIssue
              ? context.payload.issue.number
              : context.payload.pull_request.number;
            const author = isIssue
              ? context.payload.issue.user.login
              : context.payload.pull_request.user.login;

            // dependabot / bot 계정은 제외
            if (author.endsWith('[bot]') || author === 'dependabot[bot]') {
              console.log(`Skip bot author: ${author}`);
              return;
            }

            const current = isIssue
              ? context.payload.issue.assignees.map(u => u.login)
              : context.payload.pull_request.assignees.map(u => u.login);

            if (current.includes(author)) {
              console.log(`Already assigned to ${author}`);
              return;
            }

            await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number: number,
              assignees: [author],
            });
            console.log(`Assigned #${number} to ${author}`);
