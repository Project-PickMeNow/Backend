# Promtail — logs/app.log(호스트 ./logs 를 /var/log/app 로 마운트)을 tail 해서 Loki 로 보낸다.
# 앱은 pino 로 JSON 한 줄씩 남기므로, level 을 파싱해 라벨로 붙인다.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: pickmenow-backend
    static_configs:
      - targets: [localhost]
        labels:
          job: backend
          service: backend
          __path__: /var/log/app/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
      # pino 의 숫자 level 을 사람이 읽는 이름으로 변환(30=info, 40=warn, 50=error ...)
      - template:
          source: level_name
          template: >-
            {{ if eq .level "10" }}trace{{ else if eq .level "20" }}debug{{ else if eq .level "30" }}info{{ else if eq .level "40" }}warn{{ else if eq .level "50" }}error{{ else if eq .level "60" }}fatal{{ else }}info{{ end }}
      - labels:
          level: level_name
