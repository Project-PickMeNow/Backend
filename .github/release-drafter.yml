# Release Drafter 설정
# 문서: https://github.com/release-drafter/release-drafter

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# 카테고리: PR 라벨 → 릴리스 노트 섹션 분류
categories:
  - title: '✨ 신규 기능'
    labels:
      - 'type/feature'
  - title: '🐛 버그 수정'
    labels:
      - 'type/bug'
  - title: '⚡ 성능 개선'
    labels:
      - 'type/perf'
  - title: '♻️ 리팩토링'
    labels:
      - 'type/refactor'
  - title: '📝 문서'
    labels:
      - 'type/docs'
  - title: '🧪 테스트'
    labels:
      - 'type/test'
  - title: '🔧 기타 (Chore / CI)'
    labels:
      - 'type/chore'
      - 'type/ci'
      - 'type/style'
  - title: '🔐 보안'
    labels:
      - 'type/security'

# semver 자동 증가 규칙
version-resolver:
  major:
    labels:
      - 'breaking-change'
  minor:
    labels:
      - 'type/feature'
  patch:
    labels:
      - 'type/bug'
      - 'type/perf'
      - 'type/refactor'
      - 'type/chore'
      - 'type/ci'
      - 'type/docs'
      - 'type/style'
      - 'type/test'
      - 'type/security'
  default: patch

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'

# 라벨이 없는 PR 제외 (잡음 방지)
exclude-labels:
  - 'skip-changelog'
  - 'dependencies'

template: |
  ## 🚀 변경 사항

  $CHANGES

  ---
  **전체 변경 내역**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
