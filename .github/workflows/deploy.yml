name: Deploy to EC2

# CI(빌드·테스트) 성공 후에만 배포되도록 게이팅한다.
# main으로의 push는 CI를 트리거하고, CI가 성공으로 끝났을 때만 이 배포가 실행된다.
# (CI 실패 시 또는 PR 브랜치의 CI에는 배포되지 않음)
#
# ┌─ 사전 준비: Settings → Secrets and variables → Actions ────────────────────┐
# │  DOCKER_USERNAME : Docker Hub 계정명                                        │
# │  DOCKER_PASSWORD : Docker Hub 액세스 토큰 (비밀번호 대신 토큰 권장)          │
# │  EC2_HOST        : EC2 퍼블릭 IP 또는 도메인                                 │
# │  EC2_USER        : SSH 사용자 (Amazon Linux=ec2-user, Ubuntu=ubuntu)         │
# │  EC2_KEY         : EC2 접속용 개인키(.pem) 전체 내용                         │
# └────────────────────────────────────────────────────────────────────────────┘
# 서버에는 사전에 docker / docker compose 설치 + ~/app 디렉터리 + .env 배치가 필요하다.
# 레포 루트에는 Dockerfile 과 docker-compose.prod.yml 이 있어야 한다.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # CI 결론이 success일 때만 배포 (실패/취소 시 차단)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout (CI가 검증한 정확한 커밋)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker 이미지 빌드 및 푸시
        # latest 와 커밋 SHA 두 태그를 함께 밀어, 문제 시 SHA 태그로 롤백할 수 있게 한다.
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/siheung-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/siheung-backend:${{ github.event.workflow_run.head_sha }}

      - name: EC2에 compose 파일 복사
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/app"

      - name: EC2 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -euo pipefail
            cd ~/app
            # 이번에 푸시한 이미지 태그를 .env 에 갱신 (중복 라인 없이 교체)
            IMAGE="${{ secrets.DOCKER_USERNAME }}/siheung-backend:${{ github.event.workflow_run.head_sha }}"
            touch .env
            sed -i '/^DOCKER_IMAGE=/d' .env
            echo "DOCKER_IMAGE=${IMAGE}" >> .env
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            echo "✅ Deploy done: ${IMAGE}"
