name: CI

# PR / main push 마다 lint → build → test 자동 실행.
# concurrency: 같은 PR에 새 푸시가 들어오면 이전 실행을 취소하여 Actions 사용량 절감.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    name: Build & Test (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: siheung
          POSTGRES_PASSWORD: siheung
          POSTGRES_DB: siheung_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U siheung -d siheung_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-retries=3

    env:
      # 앱이 실제로 읽는 환경변수명과 1:1로 맞춘다 (.env.example 참고).
      # RedisService 는 REDIS_URL 이 아니라 REDIS_HOST/REDIS_PORT 를 읽는다.
      NODE_ENV: test
      DATABASE_URL: postgres://siheung:siheung@localhost:5432/siheung_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      FRONTEND_BASE_URL: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # package-lock.json 기준 재현 가능한 설치. lock 파일이 있어야 통과.
      - name: Install dependencies
        run: npm ci

      # 타입체크(lint·build)가 Prisma Client 타입을 필요로 하고,
      # e2e 는 서비스 컨테이너의 빈 DB 에 실제 테이블이 있어야 돈다.
      # migrate deploy 는 개발용 migrate dev 와 달리 스키마를 새로 만들지 않고
      # 커밋된 마이그레이션만 그대로 적용한다.
      - name: Prisma generate + migrate
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests (unit)
        run: npm test -- --ci

      # e2e 는 위 서비스 컨테이너의 실제 Postgres/Redis 로 검증.
      - name: Run tests (e2e)
        run: npm run test:e2e -- --ci

      - name: Publish test report (sticky comment + check)
        # jest-junit reporter 가 설정돼 있으면 리포트가 붙는다.
        # 아직 설정 전이면 require_tests:false 라 스킵만 되고 CI 는 녹색 유지.
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/junit*.xml'
          check_name: 'Jest Test Report'
          require_tests: false

      - name: Upload test artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            coverage/
            **/junit*.xml
          retention-days: 7
